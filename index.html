<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GSEB ધોરણ 10 સામાજિક વિજ્ઞાન - મોસ્ટ IMP રિવિઝન નોટ્સ</title>
  <meta name="description" content="GSEB ધોરણ 10 સામાજિક વિજ્ઞાન સંપૂર્ણ પ્રકરણવાર રિવિઝન નોટ્સ, મહત્વની સાલવારી, વ્યાખ્યાઓ અને બોર્ડ IMP પ્રશ્નોત્તરી.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1d;
      --surface: #161f36;
      --surface-hover: #1e294b;
      --border: #263353;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --purple: #818cf8;
      --purple-glow: rgba(129, 140, 248, 0.15);
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #fb7185;
      --font-gu: 'Noto Sans Gujarati', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-gu);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    /* Sticky Navigation Header */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 15, 29, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-badge {
      font-size: 10px;
      background: var(--purple-glow);
      color: var(--purple);
      border: 1px solid var(--purple);
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-back:active {
      transform: scale(0.96);
      background: var(--surface-hover);
    }

    /* Views */
    .view {
      display: none;
      padding: 16px;
      flex: 1;
    }

    .view.active {
      display: block;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Search Bar */
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px 10px 38px;
      color: #fff;
      font-size: 13px;
      font-family: var(--font-gu);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Category Filter Tabs */
    .cat-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }

    .cat-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .cat-tab.active {
      background: var(--accent);
      color: #0a0f1d;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      border: 1px solid #3730a3;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }
    .hero-title {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }
    .hero-desc {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    /* Chapter Cards Grid */
    .chapters-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chapter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s;
    }

    .chapter-card:active {
      transform: scale(0.98);
      background: var(--surface-hover);
    }

    .ch-num {
      width: 44px;
      height: 44px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      shrink-0: 0;
      font-weight: 800;
    }
    .ch-num .num-label { font-size: 8px; color: var(--text-muted); text-transform: uppercase; }
    .ch-num .num-val { font-size: 16px; color: var(--accent); line-height: 1; }

    .ch-info {
      flex: 1;
      min-width: 0;
    }
    .ch-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .badge-cat {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }

    .ch-arrow {
      color: var(--text-muted);
      font-size: 16px;
    }

    /* Detail View Styles */
    .detail-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .detail-ch-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .detail-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .detail-en {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
    }

    .listen-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .btn-listen {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(129, 140, 248, 0.15) 100%);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-family: var(--font-gu);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-listen:active {
      transform: scale(0.96);
    }

    .btn-listen.speaking {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.2) 0%, rgba(251, 113, 133, 0.2) 100%);
      border-color: var(--rose);
      color: var(--rose);
      animation: pulseGlow 1.5s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(244, 63, 94, 0); }
    }

    .audio-control-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .audio-control-btn:active {
      background: var(--surface-hover);
      transform: scale(0.92);
    }

    .live-url-card {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
    }

    .live-url-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      word-break: break-all;
    }

    .live-url-link:hover {
      text-decoration: underline;
    }

    /* Section Navigation Accordions / Tabs */
    .sec-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 16px;
      background: #0f172a;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .sec-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-family: var(--font-gu);
      font-weight: 700;
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .sec-tab.active {
      background: var(--surface);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* Card Panels */
    .content-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-heading {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .bullet-list {
      list-style: none;
    }
    .bullet-item {
      position: relative;
      padding-left: 18px;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--text-main);
      line-height: 1.6;
    }
    .bullet-item::before {
      content: "•";
      position: absolute;
      left: 2px;
      top: -1px;
      color: var(--accent);
      font-size: 18px;
      font-weight: bold;
    }
    .bullet-item strong {
      color: #fff;
    }

    /* Date Badges & Highlight Tags */
    .date-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(251, 191, 36, 0.15);
      color: var(--amber);
      border: 1px solid rgba(251, 191, 36, 0.4);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      margin-right: 6px;
    }

    .imp-badge {
      display: inline-block;
      background: rgba(251, 113, 133, 0.15);
      color: var(--rose);
      border: 1px solid rgba(251, 113, 133, 0.4);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      margin-right: 6px;
    }

    /* Q&A Accordion Item */
    .qa-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .qa-q {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .qa-a {
      font-size: 12.5px;
      color: #cbd5e1;
      line-height: 1.6;
      border-top: 1px dashed var(--border);
      padding-top: 6px;
    }

    /* Bottom Quick Nav in Chapter Detail */
    .chapter-foot-nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
      padding-bottom: 24px;
    }
    .foot-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      font-family: var(--font-gu);
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .foot-btn:active { background: var(--surface-hover); }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Sticky Header -->
    <header class="top-nav">
      <div id="nav-home-title" class="brand-title">
        <span>સામાજિક વિજ્ઞાન</span>
        <span class="brand-badge">GSEB 10</span>
      </div>

      <div id="nav-detail-bar" style="display: none; width: 100%; justify-content: space-between; align-items: center;">
        <button id="btn-back" class="btn-back">
          <span>← પાછા જાઓ</span>
        </button>
        <span id="nav-chapter-code" style="font-size: 12px; font-weight: 700; color: var(--accent);"></span>
      </div>
    </header>

    <!-- VIEW 1: HOME DASHBOARD -->
    <main id="view-home" class="view active">
      <!-- Search Input -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="પ્રકરણ, સાલવારી કે વિષય શોધો (દા.ત. મોહેં-જો-દડો, કલમ 51)...">
      </div>

      <!-- Official Live Website Banner -->
      <div class="live-url-card">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 700; color: #fff;">🌐 સત્તાવાર લાઈવ વેબસાઇટ:</span>
          <a href="https://rahulk2011.github.io/SS-STD-10-/" target="_blank" rel="noopener noreferrer" class="live-url-link">
            rahulk2011.github.io/SS-STD-10-/ ↗
          </a>
        </div>
        <button onclick="navigator.clipboard.writeText('https://rahulk2011.github.io/SS-STD-10-/'); this.textContent='કૉપિ થઈ!'; setTimeout(()=>this.textContent='કૉપિ લિંક', 1500);" style="background: var(--surface); border: 1px solid var(--border); color: #fff; font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-family: var(--font-gu);">
          કૉપિ લિંક
        </button>
      </div>

      <!-- Category Filter Tabs -->
      <div class="cat-tabs">
        <button class="cat-tab active" data-cat="all">બધા પ્રકરણો (19)</button>
        <button class="cat-tab" data-cat="ઇતિહાસ">ઇતિહાસ (Ch 1-6)</button>
        <button class="cat-tab" data-cat="ભૂગોળ">ભૂગોળ (Ch 8-14)</button>
        <button class="cat-tab" data-cat="અર્થશાસ્ત્ર">અર્થશાસ્ત્ર (Ch 15-19)</button>
        <button class="cat-tab" data-cat="નાગરિક">નાગરિક/બંધારણ (Ch 20-21)</button>
      </div>

      <!-- Quick Highlights Hero -->
      <div class="hero-banner">
        <div class="hero-title">📖 બોર્ડ પરીક્ષા ક્વિક રિવિઝન માસ્ટર</div>
        <div class="hero-desc">117 પાનાની હસ્તલિખિત નોંધોમાંથી તારવેલાં મુખ્ય મુદ્દાઓ, સાલવારી, મહત્વના નિયમો અને 100% મોસ્ટ IMP પ્રશ્નોત્તરી.</div>
      </div>

      <!-- Chapters List Grid -->
      <div id="chapters-list" class="chapters-list"></div>
    </main>

    <!-- VIEW 2: CHAPTER DETAIL SCREEN -->
    <main id="view-detail" class="view">
      <!-- Chapter Hero Tag -->
      <div class="detail-header">
        <div class="detail-ch-tag" id="det-code"></div>
        <h1 class="detail-title" id="det-title"></h1>
        <div class="detail-en" id="det-en"></div>

        <!-- Listen to Chapter Audio Row & Controls -->
        <div class="listen-row" style="flex-direction: column; align-items: stretch; gap: 8px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;">
            <button id="btn-listen" class="btn-listen" title="આખું પ્રકરણ ઓડિયોમાં સાંભળો">
              <span id="listen-icon">▶️</span>
              <span id="listen-text">પ્રકરણ સાંભળો (Play Audio)</span>
            </button>
            <div style="display: flex; align-items: center; gap: 6px;">
              <button id="btn-prev-sentence" class="audio-control-btn" title="પાછલું વાક્ય">⏮️</button>
              <button id="btn-next-sentence" class="audio-control-btn" title="આગલું વાક્ય">⏭️</button>

          <div id="audio-progress-bar" style="background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 11px; display: none;">

              <span id="audio-sentence-count" style="color: var(--accent); font-weight: 700;">વાક્ય 1/1</span>

            <div id="audio-sentence-text" style="color: #cbd5e1; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-gu);"></div>
          </div>
        </div>
      </div>

      <!-- Section Tabs -->
      <div class="sec-tabs">
        <button class="sec-tab active" data-sec="points">📌 મુદ્દાઓ</button>
        <button class="sec-tab" data-sec="dates">📅 સાલવારી</button>
        <button class="sec-tab" data-sec="terms">📖 વ્યાખ્યાઓ</button>
        <button class="sec-tab" data-sec="imp">🎯 IMP પ્રશ્નો</button>

      <!-- Content Panels -->
      <div id="panel-points" class="sec-panel"></div>
      <div id="panel-dates" class="sec-panel" style="display: none;"></div>
      <div id="panel-terms" class="sec-panel" style="display: none;"></div>
      <div id="panel-imp" class="sec-panel" style="display: none;"></div>

      <!-- Bottom Next/Prev Navigation -->
      <div class="chapter-foot-nav">
        <button id="btn-prev-ch" class="foot-btn">← પાછલું પ્રકરણ</button>
        <button id="btn-next-ch" class="foot-btn">આગલું પ્રકરણ →</button>
      </div>
    </main>
  </div>

  <script>
    // COMPLETE HANDWRITTEN NOTES DATASET FOR GSEB CLASS 10 SOCIAL SCIENCE
    const CHAPTERS_DATA = [
      {
        id: "ch-01",
        num: 1,
        code: "che:01",
        cat: "ઇતિહાસ",
        titleGu: "ભારતનો વારસો",
        titleEn: "Heritage of India",

        const inTerms = ch.terms.some(t => t.term.toLowerCase().includes(query) || (t.desc && t.desc.toLowerCase().includes(query)));
        return inTitle || inCode || inPoints || inDates || inTerms;

      // Render section contents

      // Update foot navigation buttons
      const currentIndex = CHAPTERS_DATA.findIndex(c => c.id === chId);
      btnPrevCh.style.display = currentIndex > 0 ? "block" : "none";
      btnNextCh.style.display = currentIndex < CHAPTERS_DATA.length - 1 ? "block" : "none";

      if (currentIndex > 0) {

    function getBestTTSVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      // 1. Check for Gujarati voice
      let match = voices.find(v => (v.lang && (v.lang === "gu-IN" || v.lang.startsWith("gu"))) || (v.name && v.name.toLowerCase().includes("gujarati")));

      // 2. Check for Hindi voice (available on 99% of Android & iOS devices in India)
      match = voices.find(v => (v.lang && (v.lang === "hi-IN" || v.lang.startsWith("hi"))) || (v.name && v.name.toLowerCase().includes("hindi")));
      if (match) return { voice: match, lang: match.lang || "hi-IN", label: "હિન્દી / પ્રાદેશિક વૉઇસ" };

      // 3. Indian English
      match = voices.find(v => v.lang && v.lang === "en-IN");
      if (match) return { voice: match, lang: match.lang, label: "ભારતીય અવાજ" };

      // 4. Default device voice
      const defaultVoice = voices.find(v => v.default) || voices[0];
      return { voice: defaultVoice, lang: defaultVoice.lang || "gu-IN", label: "સિસ્ટમ વૉઇસ" };
    }

    function buildChapterPlaylist(ch) {
      const list = [];
      list.push(`પ્રકરણ ${ch.num}. ${ch.titleGu}.`);
      list.push("મુખ્ય આધારભૂત મુદ્દાઓ.");
      ch.points.forEach(pt => {
        // Break long points into shorter phrases if needed
        const cleanPt = pt.replace(/[•]/g, "").trim();
        list.push(cleanPt);
      });
      list.push("મહત્વની સાલવારી અને તારીખો.");
      ch.dates.forEach(d => {
        list.push(`${d.tag}: ${d.text}`);
      });
      return list;
    }

    function stopAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      if (keepAliveInterval) {
        clearInterval(keepAliveInterval);
        keepAliveInterval = null;
      }
      if (btnListen) {
        btnListen.classList.remove("speaking");
        listenIcon.textContent = "▶️";
        listenText.textContent = "પ્રકરણ સાંભળો (Play Audio)";
      }
      if (audioProgressBar) {
        audioProgressBar.style.display = "none";
      }
    }

    function playSentenceAt(index) {
      if (!isSpeaking || !audioPlaylist || index >= audioPlaylist.length) {
        stopAudio();
        return;
      }

      currentSentenceIdx = index;
      const textToSpeak = audioPlaylist[index];

      // Update UI progress
      if (audioProgressBar) {
        audioProgressBar.style.display = "block";
        audioSentenceCount.textContent = `વાક્ય ${index + 1} / ${audioPlaylist.length}`;
        audioSentenceText.textContent = textToSpeak;
      }

      const voiceData = getBestTTSVoice();
      if (audioVoiceInfo && voiceData) {
        audioVoiceInfo.textContent = voiceData.label;
      }

      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      if (voiceData) {
        if (voiceData.voice) utterance.voice = voiceData.voice;
        utterance.lang = voiceData.lang;
      } else {
        utterance.lang = "gu-IN";
      }

      utterance.rate = 0.92;
      utterance.pitch = 1.0;

      utterance.onend = () => {
        if (isSpeaking) {
          if (currentSentenceIdx + 1 < audioPlaylist.length) {
            playSentenceAt(currentSentenceIdx + 1);
          } else {
            stopAudio();
          }
        }
      };

      utterance.onerror = (e) => {
        console.warn("TTS sentence error, skipping:", e);
        if (isSpeaking) {
          if (currentSentenceIdx + 1 < audioPlaylist.length) {
            playSentenceAt(currentSentenceIdx + 1);
          } else {
            stopAudio();
          }
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    function toggleAudio() {
      if (!('speechSynthesis' in window)) {
        alert("આ બ્રાઉઝરમાં Web Speech API ઓડિયો સુવિધા સપોર્ટ કરતી નથી. કૃપા કરીને Google Chrome અથવા Safari માં પ્રયાસ કરો.");
        return;
      }

      if (isSpeaking) {
        stopAudio();
        return;
      }

      if (!activeChapter) return;

      // Start new audio session
      isSpeaking = true;
      audioPlaylist = buildChapterPlaylist(activeChapter);
      currentSentenceIdx = 0;

      btnListen.classList.add("speaking");
      listenIcon.textContent = "⏸️";
      listenText.textContent = "ઓડિયો પોઝ (Pause Audio)";

      // Android Chrome keep-alive bugfix
      if (keepAliveInterval) clearInterval(keepAliveInterval);
      keepAliveInterval = setInterval(() => {
        if (isSpeaking && 'speechSynthesis' in window && window.speechSynthesis.speaking) {
          window.speechSynthesis.pause();
          window.speechSynthesis.resume();
        }
      }, 10000);

      playSentenceAt(0);
    }

    if (btnListen) {
      btnListen.onclick = toggleAudio;
    }

    if (btnStopAudio) {
      btnStopAudio.onclick = stopAudio;
    }

    if (btnPrevSentence) {
      btnPrevSentence.onclick = () => {
        if (isSpeaking && currentSentenceIdx > 0) {
          playSentenceAt(currentSentenceIdx - 1);
        }
      };
    }

    if (btnNextSentence) {
      btnNextSentence.onclick = () => {
        if (isSpeaking && currentSentenceIdx + 1 < audioPlaylist.length) {
          playSentenceAt(currentSentenceIdx + 1);
        }
      };
    }

    // Stop audio when navigating away
    const originalBackToHome = backToHome;
    backToHome = function() {
      stopAudio();
      originalBackToHome();
    };

    // EVENT LISTENERS
    btnBack.onclick = backToHome;

    catTabs.forEach(tab => {
      tab.onclick = () => {
        catTabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeCategory = tab.dataset.cat;
        renderChapters();
      };
    });

    searchInput.oninput = () => {
      renderChapters();
    };

    secTabs.forEach(tab => {
      tab.onclick = () => {
        switchSection(tab.dataset.sec);
      };
    });

    // INITIAL MOUNT
    renderChapters();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        // pre-load voices
        window.speechSynthesis.getVoices();
      };
    }
  </script>
</body>
